              <div style="text-align:center;">
                <div style="font-size:14px; font-weight:800;">${formatShortDate(monday)} — ${formatShortDate(sunday)}</div>
                <div style="font-size:11px; color:var(--text-sec);">Еженедельный планер</div>
              </div>
              <button class="icon-btn" data-action="change-week" data-id="1">›</button>
            </div>
          </div>
        `;

        for (let i = 0; i < 7; i++) {
          const dayIso = addDays(monday, i);
          const isToday = dayIso === today;
          const dayTasks = state.tasks.filter(t => isTaskOnDate(t, dayIso));
          const doneCnt = dayTasks.filter(t => t.completed).length;
          const pct = dayTasks.length ? Math.round((doneCnt / dayTasks.length) * 100) : 0;

          html += `
            <div class="week-day-card ${isToday ? 'today' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-weight:800; font-size:14px; color:${isToday ? 'var(--indigo)' : 'var(--text-main)'};">
                    ${WEEKDAYS[i]}, ${formatShortDate(dayIso)}
                  </span>
                  ${isToday ? `<span class="badge badge-indigo">Сегодня</span>` : ''}
                </div>
                <button data-action="open-task-modal-date" data-id="${dayIso}" style="border:none; background:var(--indigo-soft); color:var(--indigo); font-size:11px; font-weight:800; padding:4px 9px; border-radius:8px; cursor:pointer;">
                  + Задача
                </button>
              </div>
              ${dayTasks.length > 0 ? `
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                  <div class="progress-track" style="margin-top:0; height:5px; flex:1;">
                    <div class="progress-fill" style="width:${pct}%; background:var(--emerald);"></div>
                  </div>
                  <span style="font-size:10px; font-weight:800; color:var(--emerald-text);">${doneCnt}/${dayTasks.length}</span>
                </div>
              ` : ''}
              ${dayTasks.length === 0 ? `
                <div style="font-size:12px; color:var(--text-muted); padding:4px 0;">Свободный день</div>
              ` : dayTasks.map(t => `
                <div style="display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:10px; background:var(--bg-app); margin-bottom:5px;">
                  <button class="check-box ${t.completed ? 'checked' : ''}" style="width:19px; height:19px;" data-action="toggle-task" data-id="${t.id}">${t.completed ? '✓' : ''}</button>
                  <div data-action="open-task-modal" data-id="${t.id}" style="flex:1; min-width:0; cursor:pointer; font-size:13px; font-weight:600; ${t.completed ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
                    ${esc(t.title)}
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
        return html;
      }

      function renderTasksKanban() {
        return `
          <div class="kanban-scroll">
            ${KANBAN_COLS.map((col, colIdx) => {
              const items = state.tasks.filter(t => t.status === col);
              const style = KANBAN_STYLES[col] || KANBAN_STYLES['Бэклог'];
              return `
                <div class="kanban-col">
                  <div class="kanban-col-head" style="background:${style.bg};">
                    <span>${col}</span>
                    <span style="background:rgba(0,0,0,0.22); padding:2px 8px; border-radius:999px; font-size:11px;">${items.length}</span>
                  </div>
                  <div class="kanban-col-body">
                    ${items.length === 0 ? `
                      <div style="text-align:center; padding:20px 8px; color:var(--text-sec); font-size:12px;">Пусто</div>
                    ` : items.map(t => `
                      <div class="kanban-card" style="border-top:3px solid ${style.bg};">
                        <div data-action="open-task-modal" data-id="${t.id}" style="cursor:pointer;">
                          <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; margin-bottom:5px; pointer-events:none;">
                            <span class="badge ${PRIORITY_BADGES[t.priority] || 'badge-blue'}">${esc(t.priority)}</span>
                            <span style="font-size:10px; font-weight:700; color:var(--text-muted);">${t.progress}%</span>
                          </div>
                          <div style="font-size:13px; font-weight:700; pointer-events:none;">${esc(t.title)}</div>
                          <div style="font-size:11px; color:var(--text-sec); margin-top:4px; pointer-events:none;">
                            ${esc(t.assignee)} • до ${formatShortDate(t.endDate)}
                          </div>
                        </div>
                        <div class="kanban-arrows">
                          <button class="arrow-btn" data-action="kanban-left" data-id="${t.id}" ${colIdx === 0 ? 'disabled' : ''}>← Назад</button>
                          <button class="arrow-btn" data-action="kanban-right" data-id="${t.id}" ${colIdx === KANBAN_COLS.length - 1 ? 'disabled' : ''}>Вперёд →</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderTasksMatrix() {
        const quads = [
          { imp: true,  urg: true,  title: '1. ДЕЛАЙ (Важно + Срочно)',          bg: '#10b981' },
          { imp: true,  urg: false, title: '2. РЕШАЙ (Важно + Не срочно)',       bg: '#3b82f6' },
          { imp: false, urg: true,  title: '3. ДЕЛЕГИРУЙ (Не важно + Срочно)',   bg: '#f59e0b' },
          { imp: false, urg: false, title: '4. УДАЛЯЙ (Не важно + Не срочно)',bg: '#ef4444' }
        ];

        return quads.map(q => {
          const items = state.tasks.filter(t => Boolean(t.important) === q.imp && Boolean(t.urgent) === q.urg);
          return `
            <div class="matrix-quad">
              <div class="matrix-head" style="background:${q.bg};">
                <span>${q.title}</span>
                <span style="background:rgba(0,0,0,0.22); padding:2px 8px; border-radius:999px; font-size:11px;">${items.length}</span>
              </div>
              <div class="matrix-body">
                ${items.length === 0 ? `<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:14px 0;">Нет задач</div>` :
                  items.map(t => `
                    <div style="display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:10px; background:var(--bg-app); margin-bottom:6px;">
                      <button class="check-box ${t.completed ? 'checked' : ''}" style="width:19px; height:19px;" data-action="toggle-task" data-id="${t.id}">${t.completed ? '✓' : ''}</button>
                      <div data-action="open-task-modal" data-id="${t.id}" style="flex:1; min-width:0; cursor:pointer;">
                        <div style="font-size:13px; font-weight:700; pointer-events:none; ${t.completed ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">${esc(t.title)}</div>
                        <div style="font-size:11px; color:var(--text-sec); pointer-events:none;">${esc(t.priority)} • до ${formatShortDate(t.endDate)}</div>
                      </div>
                    </div>
                  `).join('')
                }
              </div>
            </div>
          `;
        }).join('');
      }

      function renderTasksGantt() {
        const today = getTodayISO();
        let minD = addDays(today, -3);
        let maxD = addDays(today, 11);

        state.tasks.forEach(t => {
          if (t.startDate && t.startDate < minD) minD = addDays(t.startDate, -2);
          if (t.endDate && t.endDate > maxD) maxD = addDays(t.endDate, 2);
        });

        const totalDays = Math.max(14, diffDays(minD, maxD) + 1);
        const dayCols = [];
        let todayIdx = -1;
        for (let i = 0; i < totalDays; i++) {
          const iso = addDays(minD, i);
          if (iso === today) todayIdx = i;
          const [, m, d] = iso.split('-').map(Number);
          dayCols.push({
            iso,
            day: d,
            mon: MONTHS_GEN[m - 1].slice(0, 3),
            isToday: iso === today
          });
        }

        const phases = {};
        state.tasks.forEach(t => {
          const p = t.phase || 'Общий проект';
          if (!phases[p]) phases[p] = [];
          phases[p].push(t);
        });

        const cellW = 30;
        const todayLineLeft = todayIdx >= 0 ? (todayIdx * cellW + cellW / 2) : -1;

        return `
          <div class="card" style="padding:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
              <div>
                <div style="font-size:13px; font-weight:800;">Диаграмма Ганта (по фазам)</div>
                <div style="font-size:11px; color:var(--text-sec);">
                  <span style="color:#10b981; font-weight:700;">■ Готово</span> •
                  <span style="color:#8b5cf6; font-weight:700;">■ В работе</span> •
                  <span style="color:#f59e0b; font-weight:700;">■ Ожидает</span> •
                  <span style="color:#ef4444; font-weight:700;">■ Просрочено</span>
                </div>
              </div>
              <span class="badge badge-indigo">${state.tasks.length} задач</span>
            </div>
          </div>

          <div class="gantt-wrap">
            <div style="min-width:${148 + totalDays * cellW}px;">
              <div class="gantt-row" style="background:var(--bg-app); min-height:38px;">
                <div class="gantt-sticky" style="background:var(--bg-app); font-size:11px; font-weight:800; color:var(--text-sec);">
                  ФАЗА / ЗАДАЧА
                </div>
                <div class="gantt-timeline">
                  ${dayCols.map(c => `
                    <div class="gantt-cell ${c.isToday ? 'today' : ''}">
                      <span style="font-size:8px; opacity:0.8;">${c.mon}</span>
                      <span>${c.day}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              ${Object.entries(phases).map(([phaseName, pTasks]) => `
                <div class="gantt-row gantt-phase-row">
                  <div class="gantt-sticky">${esc(phaseName)}</div>
                  <div class="gantt-timeline" style="width:${totalDays * cellW}px; padding-left:10px; font-size:11px; color:var(--indigo); font-weight:700;">
                    ${todayLineLeft >= 0 ? `<div class="gantt-today-line" style="left:${todayLineLeft}px;"></div>` : ''}
                    Задач в фазе: ${pTasks.length}
                  </div>
                </div>
                ${pTasks.map(t => {
                  const s = t.startDate || today;
                  const e = (t.endDate && t.endDate >= s) ? t.endDate : s;
                  const startIdx = Math.max(0, diffDays(minD, s));
                  const spanDays = Math.max(1, diffDays(s, e) + 1);
                  const leftPx = startIdx * cellW + 2;
                  const widthPx = Math.max(cellW - 4, spanDays * cellW - 4);
                  const overdue = !t.completed && e < today;

                  let fillCol = '#8b5cf6', bgCol = '#ddd6fe';
                  if (t.completed) { fillCol = '#10b981'; bgCol = '#a7f3d0'; }
                  else if (overdue) { fillCol = '#ef4444'; bgCol = '#fecaca'; }
                  else if (t.progress === 0 || t.priority === 'Заморожен') { fillCol = '#f59e0b'; bgCol = '#fde68a'; }

                  return `
                    <div class="gantt-row">
                      <div class="gantt-sticky" data-action="open-task-modal" data-id="${t.id}" style="cursor:pointer;">
                        <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; ${t.completed ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
                          ${esc(t.title)}
                        </div>
                        <div style="font-size:10px; color:var(--text-sec); pointer-events:none;">${spanDays} дн. • ${t.progress}%</div>
                      </div>
                      <div class="gantt-timeline" style="width:${totalDays * cellW}px;">
                        ${dayCols.map(c => `<div class="gantt-cell ${c.isToday ? 'today' : ''}"></div>`).join('')}
                        ${todayLineLeft >= 0 ? `<div class="gantt-today-line" style="left:${todayLineLeft}px;"></div>` : ''}
                        <div class="gantt-bar" data-action="open-task-modal" data-id="${t.id}" style="left:${leftPx}px; width:${widthPx}px; background:${bgCol};">
                          <div class="gantt-bar-fill" style="width:${t.progress}%; background:${fillCol}; pointer-events:none;"></div>
                          <span class="gantt-bar-label" style="pointer-events:none;">${t.progress}%</span>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderTasks() {
        const sub = state.ui.taskSub || 'list';
        let bodyHtml = '';
        if (sub === 'list') bodyHtml = renderTasksList();
        else if (sub === 'week') bodyHtml = renderTasksWeek();
        else if (sub === 'kanban') bodyHtml = renderTasksKanban();
        else if (sub === 'matrix') bodyHtml = renderTasksMatrix();
        else if (sub === 'gantt') bodyHtml = renderTasksGantt();

        return `
          <div class="card-header">
            <div>
              <h2 style="font-size:18px; font-weight:800;">Задачи и Проекты</h2>
              <p class="card-sub">5 режимов планирования из ваших таблиц</p>
            </div>
            <button data-action="open-task-modal" style="padding:9px 14px; border-radius:12px; border:none; background:linear-gradient(135deg, #4f46e5, #6366f1); color:#fff; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 3px 8px rgba(79,70,229,0.25);">
              + Задача
            </button>
          </div>

          <div class="pills-bar">
            <button class="pill-btn ${sub==='list'?'active':''}" data-action="switch-task-sub" data-id="list">Список</button>
            <button class="pill-btn ${sub==='week'?'active':''}" data-action="switch-task-sub" data-id="week">Неделя</button>
            <button class="pill-btn ${sub==='kanban'?'active':''}" data-action="switch-task-sub" data-id="kanban">Канбан</button>
            <button class="pill-btn ${sub==='matrix'?'active':''}" data-action="switch-task-sub" data-id="matrix">Матрица</button>
            <button class="pill-btn ${sub==='gantt'?'active':''}" data-action="switch-task-sub" data-id="gantt">Гант</button>
          </div>

          ${bodyHtml}
        `;
      }

      // -------------------------------------------------------------------------
      // ВКЛАДКА ПРИВЫЧКИ (МЕСЯЦ + ГОДОВОЙ ОБЗОР 12 МЕСЯЦЕВ)
      // -------------------------------------------------------------------------
      function renderHabitsAnnual() {
        const y = state.ui.habitYear;
        let yearDone = 0;
        let yearGoal = 0;

        const habitRows = state.habits.map(h => {
          let hDone = 0;
          let hGoal = 0;
          for (let m = 0; m < 12; m++) {
            const ymKey = getYmKey(y, m);
            const daysInM = new Date(y, m + 1, 0).getDate();
            const logs = h.logs?.[ymKey] || {};
            for (let d = 1; d <= daysInM; d++) { if (logs[d]) hDone++; }
            hGoal += Math.min(daysInM, Math.max(1, Number(h.target) || daysInM));
          }
          yearDone += hDone;
          yearGoal += hGoal;
          const pct = hGoal ? Math.min(100, Math.round((hDone / hGoal) * 100)) : 0;
          return { ...h, hDone, hGoal, pct };
        });

        const yearPct = yearGoal ? Math.min(100, Math.round((yearDone / yearGoal) * 100)) : 0;

        return `
          <div class="card" style="border-top:4px solid var(--pink);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <button class="icon-btn" data-action="change-habit-year" data-id="-1">‹</button>
              <div style="text-align:center;">
                <div style="font-size:16px; font-weight:800;">Годовой обзор: ${y} год</div>
                <div style="font-size:11px; color:var(--text-sec); font-weight:600;">Выполнено ${yearDone} из ${yearGoal} целей (${yearPct}%)</div>
              </div>
              <button class="icon-btn" data-action="change-habit-year" data-id="1">›</button>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${yearPct}%; background:linear-gradient(90deg, #ec4899, #10b981);"></div></div>
          </div>

          <div class="card" style="border-top:4px solid var(--indigo);">
            <div class="card-header">
              <div>
                <div class="card-title">Прогресс по месяцам (12 мес.)</div>
                <div class="card-sub">Количество выполнений в каждом месяце ${y} года</div>
              </div>
              <span class="badge badge-indigo">${yearDone} отм.</span>
            </div>
            ${buildAnnualHabitChartSvg(y)}
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">Итоги по каждой привычке за ${y} г.</div>
            </div>
            ${habitRows.length === 0 ? `
              <div style="text-align:center; padding:16px; color:var(--text-muted); font-size:12px;">Привычки ещё не добавлены</div>
            ` : habitRows.map(h => `
              <div class="clickable-card" data-action="open-habit-modal" data-id="${h.id}" style="padding:10px; border-radius:12px; background:var(--bg-muted); border:1px solid var(--border); margin-bottom:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center; pointer-events:none;">
                  <span style="font-weight:700; font-size:13px;">${esc(h.name)}</span>
                  <span style="font-weight:800; font-size:12px; color:${h.color};">${h.hDone} / ${h.hGoal} (${h.pct}%)</span>
                </div>
                <div class="progress-track" style="height:6px; margin-top:6px; pointer-events:none;">
                  <div class="progress-fill" style="width:${h.pct}%; background:${h.color};"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderHabits() {
        const view = state.ui.habitView || 'month';
        const y = state.ui.habitYear;
        const m = state.ui.habitMonth;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const ymKey = getYmKey(y, m);

        const now = new Date();
        const todayDay = (now.getFullYear() === y && now.getMonth() === m) ? now.getDate() : -1;

        let totalGoal = 0, totalDone = 0;

        const rows = state.habits.map(h => {
          const logs = h.logs?.[ymKey] || {};
          let done = 0;
          for (let d = 1; d <= daysInMonth; d++) { if (logs[d]) done++; }
          const goal = Math.min(daysInMonth, Math.max(1, Number(h.target) || daysInMonth));
          const pct = Math.min(100, Math.round((done / goal) * 100));
          totalGoal += goal;
          totalDone += done;
          return { ...h, logs, done, goal, pct };
        });

        const overallPct = totalGoal ? Math.min(100, Math.round((totalDone / totalGoal) * 100)) : 0;

        return `
          <div class="card-header">
            <div>
              <h2 style="font-size:18px; font-weight:800;">Трекер привычек</h2>
              <p class="card-sub">Тап по названию — настроить цель</p>
            </div>
            <button data-action="open-habit-modal" style="padding:9px 14px; border-radius:12px; border:none; background:linear-gradient(135deg, #ec4899, #f43f5e); color:#fff; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 3px 8px rgba(236,72,153,0.28);">
              + Привычка
            </button>
          </div>

          <div class="pills-bar">
            <button class="pill-btn ${view==='month'?'active':''}" data-action="switch-habit-view" data-id="month">Месяц (Сетка)</button>
            <button class="pill-btn ${view==='year'?'active':''}" data-action="switch-habit-view" data-id="year">Год (12 месяцев)</button>
          </div>

          ${view === 'year' ? renderHabitsAnnual() : `
            <div class="card" style="border-top:4px solid var(--pink);">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <button class="icon-btn" data-action="change-habit-month" data-id="-1">‹</button>
                <div style="text-align:center;">
                  <div style="font-size:15px; font-weight:800;">${MONTHS_NOM[m]} ${y}</div>
                  <div style="font-size:11px; color:var(--text-sec); font-weight:600;">Выполнено ${totalDone} из ${totalGoal} целей (${overallPct}%)</div>
                </div>
                <button class="icon-btn" data-action="change-habit-month" data-id="1">›</button>
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${overallPct}%; background:linear-gradient(90deg, #ec4899, #10b981);"></div></div>
            </div>

            ${rows.length === 0 ? `
              <div class="card" style="text-align:center; padding:24px;">
                <p class="card-sub">Добавьте первую привычку, чтобы начать трекинг</p>
              </div>
            ` : `
              <div class="habit-scroll" style="margin-bottom:12px;">
                <div style="min-width:${150 + daysInMonth * 32}px;">
                  <div class="habit-row" style="background:var(--bg-app);">
                    <div class="habit-sticky" style="background:var(--bg-app); font-size:11px; font-weight:800; color:var(--text-sec);">
                      ПРИВЫЧКА / ЦЕЛЬ
                    </div>
                    <div style="display:flex;">
                      ${Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => `
                        <div class="habit-day-cell" style="font-size:11px; font-weight:800; ${d === todayDay ? 'background:var(--pink); color:#fff;' : 'color:var(--text-sec);'}">
                          ${d}
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  ${rows.map(h => `
                    <div class="habit-row">
                      <div class="habit-sticky" data-action="open-habit-modal" data-id="${h.id}" style="cursor:pointer;">
                        <div style="min-width:0; flex:1; pointer-events:none;">
                          <div style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(h.name)}</div>
                          <div style="font-size:10px; font-weight:800; color:${h.color};">${h.done}/${h.goal} дн. (${h.pct}%)</div>
                          <div class="progress-track" style="height:4px; margin-top:4px;"><div class="progress-fill" style="width:${h.pct}%; background:${h.color};"></div></div>
                        </div>
                      </div>
                      <div style="display:flex;">
                        ${Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
                          const active = Boolean(h.logs[d]);
                          return `
                            <div class="habit-day-cell" style="${d === todayDay ? 'background:var(--pink-soft);' : ''}">
                              <button class="habit-btn ${active ? 'active' : ''}" style="${active ? `background:${h.color}; border-color:${h.color};` : ''}" data-action="toggle-habit-day" data-habit="${h.id}" data-day="${d}">✓</button>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="card" style="border-top:4px solid var(--emerald);">
                <div class="card-header">
                  <div class="card-title">Активность по дням месяца</div>
                  <span class="badge badge-pink">${overallPct}%</span>
                </div>
                ${buildHabitChartSvg(y, m, daysInMonth)}
              </div>
            `}
          `}
        `;
      }

      // -------------------------------------------------------------------------
      // ВКЛАДКА ФИНАНСЫ И БЮДЖЕТ
      // -------------------------------------------------------------------------
      function renderBudget() {
        const ymKey = state.ui.activeMonth;
        const [y, mNum] = ymKey.split('-').map(Number);
        const mIdx = mNum - 1;
        const metrics = getBudgetMetrics(ymKey);
        const overLimit = metrics.dailyLeft < 0;

        const filter = state.ui.budgetFilter || 'all';
        const search = (state.ui.budgetSearch || '').trim().toLowerCase();

        const filteredTxs = [...metrics.txs]
          .filter(t => filter === 'all' || t.group === filter)
          .filter(t => !search || (t.sub || '').toLowerCase().includes(search) || (t.desc || '').toLowerCase().includes(search))
          .sort((a, b) => b.date.localeCompare(a.date));

        const groupMap = {};
        BUDGET_GROUPS.forEach(g => { groupMap[g.key] = g; });

        const debtFact = metrics.facts.debts || 0;
        const savFact = metrics.facts.savings || 0;
        const dsTotal = Math.max(1, debtFact + savFact);
        const savShare = Math.round((savFact / dsTotal) * 100);

        return `
          <!-- Переключатель месяцев -->
          <div class="card" style="padding:10px 14px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <button class="icon-btn" data-action="change-budget-month" data-id="-1">‹</button>
              <div style="text-align:center;">
                <div style="font-size:16px; font-weight:800;">${MONTHS_NOM[mIdx]} ${y}</div>
                <div style="font-size:11px; color:var(--text-sec);">Планы и категории наследуются</div>
              </div>
              <button class="icon-btn" data-action="change-budget-month" data-id="1">›</button>
            </div>
          </div>

          <!-- 4 карточки баланса -->
          <div class="grid-2" style="margin-bottom:10px;">
            <div class="stat-box" style="border-top:3px solid #64748b;">
              <div class="stat-label">Начальный баланс</div>
              <input type="number" value="${metrics.mData.startBalance}" data-field="startBalance" class="budget-meta-input"
                     style="width:100%; border:none; font-size:17px; font-weight:800; color:var(--text-main); background:transparent;" />
              <div class="stat-sub">Нажмите для правки</div>
            </div>
            <div class="stat-box" style="background:var(--indigo-soft); border-color:#c7d2fe; border-top:3px solid var(--indigo);">
              <div class="stat-label" style="color:var(--indigo);">Конечный баланс</div>
              <div class="stat-val" style="color:var(--indigo);">${formatRub(metrics.endBalance)}</div>
              <div class="stat-sub">Копилка: ${formatRub(savFact)}</div>
            </div>
            <div class="stat-box" style="border-top:3px solid var(--emerald);">
              <div class="stat-label">Доходы (Факт / План)</div>
              <div class="stat-val" style="color:var(--emerald-text); font-size:15px;">${formatRub(metrics.facts.income)}</div>
              <div class="stat-sub">План: ${formatRub(metrics.plans.income)}</div>
            </div>
            <div class="stat-box" style="border-top:3px solid var(--rose);">
              <div class="stat-label">Расходы (Факт / План)</div>
              <div class="stat-val" style="color:var(--rose-text); font-size:15px;">${formatRub(metrics.totalExpenseFact)}</div>
              <div class="stat-sub">План: ${formatRub(metrics.totalExpensePlan)}</div>
            </div>
          </div>

          <!-- Дневной лимит -->
          <div class="card" style="border-left:5px solid ${overLimit ? 'var(--rose)' : 'var(--emerald)'}; background:${overLimit ? '#fef2f2' : '#ecfdf5'};">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div>
                <div style="font-size:13px; font-weight:800;">Дневной лимит трат</div>
                <div style="font-size:12px; color:var(--text-sec); margin-top:2px;">
                  За ${formatShortDate(metrics.checkDate)}: <b>${formatRub(metrics.daySpent)}</b> •
                  <b style="color:${overLimit ? 'var(--rose-text)' : 'var(--emerald-text)'};">
                    ${overLimit ? 'Превышение ' + formatRub(Math.abs(metrics.dailyLeft)) : 'Осталось ' + formatRub(metrics.dailyLeft)}
                  </b>
                </div>
              </div>
              <div style="background:#fff; padding:6px 10px; border-radius:10px; border:1px solid var(--border); display:flex; align-items:center; gap:4px;">
                <input type="number" value="${metrics.dailyLimit}" data-field="dailyLimit" class="budget-meta-input"
                       style="width:66px; border:none; text-align:right; font-weight:800; font-size:13px;" />
                <span style="font-size:12px; font-weight:700;">₽</span>
              </div>
            </div>
          </div>

          <!-- Визуальная аналитика: План vs Факт и Долги vs Сбережения -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">План vs Факт по категориям</div>
                <div class="card-sub">Серый — План • Цветной — Факт</div>
              </div>
            </div>
            ${buildPlanVsFactSvg(metrics)}
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--bg-muted);">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; margin-bottom:4px;">
                <span style="color:var(--violet-text);">Сбережения: ${formatRub(savFact)}</span>
                <span style="color:var(--amber-text);">Долги: ${formatRub(debtFact)}</span>
              </div>
              <div style="height:9px; background:var(--amber); border-radius:999px; overflow:hidden; display:flex;">
                <div style="width:${(debtFact + savFact) === 0 ? 50 : savShare}%; background:var(--violet); height:100%;"></div>
              </div>
            </div>
          </div>

          <!-- 5 цветных блоков категорий -->
          ${BUDGET_GROUPS.map(g => {
            const isOpen = Boolean(state.ui.expandedGroups[g.key]);
            const subList = metrics.mData.categories[g.key] || [];
            const gPlan = metrics.plans[g.key] || 0;
            const gFact = metrics.facts[g.key] || 0;
            const rem = g.isIncome ? (gFact - gPlan) : (gPlan - gFact);

            return `
              <div class="card" style="padding:13px 15px; border-left:5px solid ${g.color};">
                <div class="budget-acc-head" data-action="toggle-budget-group" data-id="${g.key}">
                  <div style="pointer-events:none;">
                    <div class="card-title">${g.label} <span style="font-size:11px; color:var(--text-muted);">(${subList.length})</span></div>
                    <div class="card-sub">
                      План: <b>${formatRub(gPlan)}</b> • Факт: <b>${formatRub(gFact)}</b> •
                      <span style="font-weight:800; color:${rem < 0 ? 'var(--rose-text)' : 'var(--emerald-text)'};">
                        ${rem > 0 ? '+' : ''}${formatRub(rem)}
                      </span>
                    </div>
                  </div>
                  <span style="font-size:13px; font-weight:800; color:${g.color}; pointer-events:none;">${isOpen ? '▲' : '▼'}</span>
                </div>

                ${isOpen ? `
                  <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--bg-muted);">
                    ${subList.map(sc => {
                      const scFact = metrics.txs
                        .filter(tx => tx.group === g.key && tx.sub === sc.name)
                        .reduce((a, tx) => a + Number(tx.amount || 0), 0);
                      return `
                        <div class="subcat-item">
                          <div style="flex:1; min-width:0;">
                            <div style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(sc.name)}</div>
                            <div style="font-size:11px; color:var(--text-sec);">
                              Факт: <b>${formatRub(scFact)}</b>
                              ${g.hasDue && sc.dueDay ? ` • <span style="color:var(--amber-text); font-weight:700;">до ${esc(sc.dueDay)} числа</span>` : ''}
                            </div>
                          </div>
                          <div style="display:flex; align-items:center; gap:6px;">
                            <div style="text-align:right;">
                              <div style="font-size:9px; color:var(--text-muted); font-weight:800;">ПЛАН ₽</div>
                              <input type="number" value="${sc.plan}" data-group="${g.key}" data-subid="${sc.id}" class="subcat-plan-input"
                                     style="width:74px; text-align:right; border:1px solid var(--border); border-radius:8px; padding:4px 6px; font-size:12px; font-weight:700;" />
                            </div>
                            <button data-action="delete-subcat" data-group="${g.key}" data-subid="${sc.id}" style="border:none; background:none; color:var(--text-muted); padding:4px; cursor:pointer;" title="Удалить">✕</button>
                          </div>
                        </div>
                      `;
                    }).join('')}

                    <button data-action="open-subcat-modal" data-id="${g.key}" style="margin-top:8px; width:100%; padding:8px; border-radius:10px; border:1px dashed ${g.color}; background:var(--bg-muted); color:${g.color}; font-size:12px; font-weight:800; cursor:pointer;">
                      + Подкатегория
                    </button>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}

          <!-- Журнал операций -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Журнал операций</div>
                <div class="card-sub">Тап по записи для редактирования</div>
              </div>
              <button data-action="open-tx-modal" style="padding:8px 13px; border-radius:11px; border:none; background:linear-gradient(135deg, #4f46e5, #6366f1); color:#fff; font-size:12px; font-weight:800; cursor:pointer;">
                + Операция
              </button>
            </div>

            <div class="form-group" style="margin-bottom:8px;">
              <input id="budget-search-input" class="form-control" type="search"
                     value="${esc(state.ui.budgetSearch || '')}"
                     placeholder="Поиск по описанию или подкатегории..."
                     style="padding:8px 12px; font-size:13px;" />
            </div>

            <div class="pills-bar">
              <button class="pill-btn ${filter==='all'?'active':''}" data-action="set-budget-filter" data-id="all">Все</button>
              ${BUDGET_GROUPS.map(g => `
                <button class="pill-btn ${filter===g.key?'active':''}" data-action="set-budget-filter" data-id="${g.key}">${g.short}</button>
              `).join('')}
            </div>

            ${filteredTxs.length === 0 ? `
              <div style="text-align:center; padding:18px; color:var(--text-muted); font-size:12px;">
                Операций за этот период не найдено
              </div>
            ` : filteredTxs.map(tx => {
              const info = groupMap[tx.group] || groupMap.expenses;
              const isInc = tx.group === 'income';
              return `
                <div class="task-row" style="align-items:center; border-left-color:${info.color}; background:var(--bg-muted);">
                  <div class="task-body" data-action="open-tx-modal" data-id="${tx.id}">
                    <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; pointer-events:none;">
                      <span class="badge ${info.badge}">${info.short}</span>
                      <span style="font-weight:700; font-size:13px;">${esc(tx.sub)}</span>
                    </div>
                    <div style="font-size:11px; color:var(--text-sec); margin-top:4px; pointer-events:none;">
                      ${formatShortDate(tx.date)} ${tx.desc ? '• ' + esc(tx.desc) : ''}
                    </div>
                  </div>
                  <div data-action="open-tx-modal" data-id="${tx.id}" style="font-weight:800; font-size:14px; cursor:pointer; color:${isInc ? 'var(--emerald-text)' : 'var(--text-main)'};">
                    ${isInc ? '+' : '−'}${formatRub(tx.amount)}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // =========================================================================
      // 8. МОДАЛЬНЫЕ ФОРМЫ (ЗАКРЫТИЕ ТОЛЬКО ПО КНОПКАМ ИЛИ ANDROID BACK)
      // =========================================================================
      function showTaskModal(taskId = null, defaultDate = null) {
        const existing = taskId ? state.tasks.find(x => x.id === taskId) : null;
        const today = defaultDate || getTodayISO();
        const t = existing || {
          title: '',
          desc: '',
          assignee: 'Я',
          type: 'Разовая',
          recurrence: 'Ежедневно',
          phase: 'Личный проект',
          priority: 'Высокий',
          status: 'Бэклог',
          important: true,
          urgent: false,
          startDate: today,
          endDate: today,
          progress: 0
        };

        openModal(`
          <div class="modal-head">
            <span style="font-weight:800; font-size:16px;">${existing ? 'Редактировать задачу' : 'Новая задача'}</span>
            <button class="icon-btn" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            <form id="form-task" data-edit-id="${existing ? existing.id : ''}">
              <div class="form-group">
                <label class="form-label">Название задачи *</label>
                <input id="f-task-title" class="form-control" type="text" required value="${esc(t.title)}" placeholder="Например: Подготовить отчет" />
              </div>

              <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea id="f-task-desc" class="form-control" rows="2" placeholder="Детали задачи...">${esc(t.desc || '')}</textarea>
              </div>

              <div class="grid-2 form-group">
                <div>
                  <label class="form-label">Тип задачи</label>
                  <select id="f-task-type" class="form-control">
                    <option value="Разовая" ${t.type==='Разовая'?'selected':''}>Разовая</option>
                    <option value="Повторяющаяся" ${t.type==='Повторяющаяся'?'selected':''}>Повторяющаяся</option>
                  </select>
                </div>
                <div id="f-rec-wrap" style="display:${t.type==='Повторяющаяся'?'block':'none'};">
                  <label class="form-label">Периодичность</label>
                  <select id="f-task-rec" class="form-control">
                    <option value="Ежедневно" ${t.recurrence==='Ежедневно'?'selected':''}>Ежедневно</option>
                    <option value="Еженедельно" ${t.recurrence==='Еженедельно'?'selected':''}>Еженедельно</option>
                    <option value="Раз в 2 недели" ${t.recurrence==='Раз в 2 недели'?'selected':''}>Раз в 2 недели</option>
                    <option value="Ежемесячно" ${t.recurrence==='Ежемесячно'?'selected':''}>Ежемесячно</option>
                  </select>
                </div>
              </div>

              <div class="form-group" style="background:var(--bg-app); padding:10px 12px; border-radius:12px; border:1px solid var(--border);">
                <div style="font-size:12px; font-weight:800; margin-bottom:6px;">Матрица Эйзенхауэра:</div>
                <div style="display:flex; gap:18px;">
                  <label style="display:flex; align-items:center; gap:6px; font-weight:700; cursor:pointer;">
                    <input id="f-task-imp" type="checkbox" ${t.important ? 'checked' : ''} style="width:16px; height:16px;" /> Важно
                  </label>
                  <label style="display:flex; align-items:center; gap:6px; font-weight:700; cursor:pointer;">
                    <input id="f-task-urg" type="checkbox" ${t.urgent ? 'checked' : ''} style="width:16px; height:16px;" /> Срочно
                  </label>
                </div>
              </div>

              <div class="grid-2 form-group">
                <div>
                  <label class="form-label">Приоритет</label>
                  <select id="f-task-priority" class="form-control">
                    ${PRIORITIES.map(p => `<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="form-label">Статус Канбана</label>
                  <select id="f-task-status" class="form-control">
                    ${KANBAN_COLS.map(c => `<option value="${c}" ${t.status===c?'selected':''}>${c}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="grid-2 form-group">
                <div>
                  <label class="form-label">Фаза Ганта / Проект</label>
                  <input id="f-task-phase" class="form-control" type="text" value="${esc(t.phase)}" placeholder="Рабочий проект" />
                </div>
                <div>
                  <label class="form-label">Ответственный</label>
                  <input id="f-task-assignee" class="form-control" type="text" value="${esc(t.assignee || 'Я')}" />
                </div>
              </div>

              <div class="grid-2 form-group">
                <div>
                  <label class="form-label">Дата начала</label>
                  <input id="f-task-start" class="form-control" type="date" value="${t.startDate}" required />
                </div>
                <div>
                  <label class="form-label">Дедлайн</label>
                  <input id="f-task-end" class="form-control" type="date" value="${t.endDate}" required />
                </div>
              </div>

              <div class="form-group">
                <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800; margin-bottom:4px;">
                  <span>Прогресс (0–100%)</span>
                  <span id="f-prog-lbl" style="color:var(--indigo);">${t.progress}%</span>
                </div>
                <input id="f-task-prog" type="range" min="0" max="100" step="5" value="${t.progress}" style="width:100%;" />
              </div>

              <div style="display:flex; gap:8px; margin-top:14px;">
                ${existing ? `<button type="button" class="btn-danger-soft" data-action="delete-task" data-id="${existing.id}">Удалить</button>` : `<button type="button" class="btn-secondary" style="width:auto;" data-action="close-modal">Отмена</button>`}
                <button type="submit" class="btn-primary">${existing ? 'Сохранить' : 'Создать задачу'}</button>
              </div>
            </form>
          </div>
        `);
      }

      function showHabitModal(habitId = null) {
        const existing = habitId ? state.habits.find(x => x.id === habitId) : null;
        const maxDays = new Date(state.ui.habitYear, state.ui.habitMonth + 1, 0).getDate();
        const nameVal = existing ? existing.name : '';
        const targetVal = existing ? existing.target : Math.min(25, maxDays);
        const colorVal = existing ? existing.color : HABIT_COLORS[0].hex;

        openModal(`
          <div class="modal-head">
            <span style="font-weight:800; font-size:16px;">${existing ? 'Редактировать привычку' : 'Новая привычка'}</span>
            <button class="icon-btn" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            <form id="form-habit" data-edit-id="${existing ? existing.id : ''}">
              <div class="form-group">
                <label class="form-label">Название привычки *</label>
                <input id="f-hab-name" class="form-control" type="text" required value="${esc(nameVal)}" placeholder="Например: Спортзал или Чтение" />
              </div>
              <div class="grid-2 form-group">
                <div>
                  <label class="form-label">Цель дней в месяц (1–31)</label>
                  <input id="f-hab-target" class="form-control" type="number" min="1" max="31" value="${targetVal}" required />
                </div>
                <div>
                  <label class="form-label">Цвет индикатора</label>
                  <select id="f-hab-color" class="form-control">
                    ${HABIT_COLORS.map(c => `<option value="${c.hex}" ${colorVal===c.hex?'selected':''}>${c.name}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div style="display:flex; gap:8px; margin-top:14px;">
                ${existing ? `<button type="button" class="btn-danger-soft" data-action="delete-habit" data-id="${existing.id}">Удалить</button>` : `<button type="button" class="btn-secondary" style="width:auto;" data-action="close-modal">Отмена</button>`}
                <button type="submit" class="btn-primary" style="background:linear-gradient(135deg, #ec4899, #f43f5e);">${existing ? 'Сохранить' : 'Добавить привычку'}</button>
              </div>
            </form>
          </div>
        `);
      }

      function showSubcatModal(groupKey) {
        const grp = BUDGET_GROUPS.find(g => g.key === groupKey) || BUDGET_GROUPS[1];
        openModal(`
          <div class="modal-head">
            <span style="font-weight:800; font-size:16px;">+ Подкатегория (${grp.label})</span>
            <button class="icon-btn" data-action="close-modal">✕</button>
          </div>
          <div class="modal-body">
            <form id="form-subcat" data-group="${grp.key}">
              <div class="form-group">
                <label class="form-label">Название подкатегории *</label>
                <input id="f-sc-name" class="form-control" type="text" required placeholder="Например: Спорт или Кэшбэк" />
              </div>
              <div class="form-group">
                <label class="form-label">Плановая сумма на месяц (₽)</label>
                <input id="f-sc-plan" class="form-control" type="number" min="0" step="any" value="0" required />
              </div>
              ${grp.hasDue ? `
                <div class="form-group">
                  <label class="form-label">Срок оплаты (день месяца, 1–31)</label>
                  <input id="f-sc-due" class="form-control" type="number" min="1" max="31" placeholder="Например: 15" />
                </div>
              ` : ''}
              <div style="display:flex; gap:8px; margin-top:14px;">
                <button type="button" class="btn-secondary" style="width:auto;" data-action="close-modal">Отмена</button>
                <button type="submit" class="btn-primary">Добавить подкатегорию</button>
              </div>
            </form>
          </div>
        `);
      }

      function populateSubcatSelect(groupKey, selectedVal) {
        const sel = document.getElementById('f-tx-sub');
        if (!sel) return;
        const mData = ensureMonth(state.ui.activeMonth);
        const list = (mData.categories[groupKey] || []).map(s => s.name);
        if (selectedVal && !list.includes(selectedVal)) list.unshift(selectedVal);
        if (list.length === 0) list.push('Прочее');
        sel.innerHTML = list.map(s => `<option value="${esc(s)}" ${s === selectedVal ? 'selected' : ''}>${esc(s)}</option>`).join('');
      }

      }

      function getBackupJson() {
        return JSON.stringify({ app: 'LifeOS', version: 6, exportedAt: new Date().toISOString(), data: state }, null, 2);
      }

      // =========================================================================
      // 9. ЕДИНЫЙ ОБРАБОТЧИК СОБЫТИЙ
      // =========================================================================
      document.addEventListener('click', function(e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.getAttribute('data-action');
        const id = target.getAttribute('data-id');

        if (action === 'switch-tab') {
          state.ui.tab = id;
          persist();
          renderApp();
          window.scrollTo(0, 0);
        }
        else if (action === 'switch-task-sub') {
          state.ui.taskSub = id;
          persist();
          renderApp();
        }
        else if (action === 'set-task-filter') {
          state.ui.taskFilter = id;
          persist();
          renderApp();
        }
        else if (action === 'toggle-task') {
          const t = state.tasks.find(x => x.id === id);
          if (!t) return;
          t.completed = !t.completed;
          if (t.completed) {
            t.progress = 100;
            t.status = 'Сделано';
            const nextDate = spawnNextRecurring(t);
            persist();
            renderApp();
            showToast(nextDate ? `Выполнено! Повтор на ${formatShortDate(nextDate)}` : 'Задача выполнена!');
          } else {
            if (t.progress === 100) t.progress = 50;
            if (t.status === 'Сделано') t.status = 'В работе';
            persist();
            renderApp();
            showToast('Возвращено в работу');
          }
        }
        else if (action === 'kanban-left' || action === 'kanban-right') {
          const t = state.tasks.find(x => x.id === id);
          if (!t) return;
          const delta = action === 'kanban-right' ? 1 : -1;
          const idx = KANBAN_COLS.indexOf(t.status);
          const nextIdx = idx + delta;
          if (nextIdx < 0 || nextIdx >= KANBAN_COLS.length) return;
          t.status = KANBAN_COLS[nextIdx];
          if (t.status === 'Сделано') {
            t.completed = true;
            t.progress = 100;
            const nextDate = spawnNextRecurring(t);
            persist();
            renderApp();
            showToast(nextDate ? `Сделано! Повтор на ${formatShortDate(nextDate)}` : 'Этап: Сделано');
          } else {
            t.completed = false;
            if (t.progress === 100) t.progress = 75;
            persist();
            renderApp();
            showToast(`Этап: ${t.status}`);
          }
        }
        else if (action === 'change-week') {
          state.ui.weekOffset = (state.ui.weekOffset || 0) + Number(id);
          persist();
          renderApp();
        }
        else if (action === 'open-task-modal') {
          showTaskModal(id || null, null);
        }
        else if (action === 'open-task-modal-date') {
          showTaskModal(null, id);
        }
        else if (action === 'delete-task') {
          state.tasks = state.tasks.filter(x => x.id !== id);
          persist();
          closeModal();
          renderApp();
          showToast('Задача удалена');
        }
        else if (action === 'switch-habit-view') {
          state.ui.habitView = id;
          persist();
          renderApp();
        }
        else if (action === 'open-habit-modal') {
          showHabitModal(id || null);
        }
        else if (action === 'delete-habit') {
          state.habits = state.habits.filter(x => x.id !== id);
          persist();
          closeModal();
          renderApp();
          showToast('Привычка удалена');
        }
        else if (action === 'toggle-habit-day') {
          const hId = target.getAttribute('data-habit');
          const day = Number(target.getAttribute('data-day'));
          const h = state.habits.find(x => x.id === hId);
          if (!h) return;
          const ymKey = getYmKey(state.ui.habitYear, state.ui.habitMonth);
          if (!h.logs) h.logs = {};
          if (!h.logs[ymKey]) h.logs[ymKey] = {};
          h.logs[ymKey][day] = !h.logs[ymKey][day];
          persist();
          renderApp();
        }
        else if (action === 'change-habit-month') {
          let m = state.ui.habitMonth + Number(id);
          let y = state.ui.habitYear;
          if (m < 0) { m = 11; y--; }
          if (m > 11) { m = 0; y++; }
          state.ui.habitMonth = m;
          state.ui.habitYear = y;
          persist();
          renderApp();
        }
        else if (action === 'change-habit-year') {
          state.ui.habitYear += Number(id);
          persist();
          renderApp();
        }
        else if (action === 'change-budget-month') {
          const [y, mNum] = state.ui.activeMonth.split('-').map(Number);
          const nextDt = new Date(y, mNum - 1 + Number(id), 1);
          const nextYm = getYmKey(nextDt.getFullYear(), nextDt.getMonth());
          state.ui.activeMonth = nextYm;
          ensureMonth(nextYm);
          persist();
          renderApp();
        }
        else if (action === 'toggle-budget-group') {
          state.ui.expandedGroups[id] = !state.ui.expandedGroups[id];
          persist();
          renderApp();
        }
        else if (action === 'open-subcat-modal') {
          showSubcatModal(id);
        }
        else if (action === 'delete-subcat') {
          const gKey = target.getAttribute('data-group');
          const subId = target.getAttribute('data-subid');
          const mData = ensureMonth(state.ui.activeMonth);
          mData.categories[gKey] = (mData.categories[gKey] || []).filter(s => s.id !== subId);
          persist();
          renderApp();
          showToast('Подкатегория удалена');
        }
        else if (action === 'set-budget-filter') {
          state.ui.budgetFilter = id;
          persist();
          renderApp();
        }
        else if (action === 'open-tx-modal') {
          showTxModal(id || null);
        }
        else if (action === 'delete-tx') {
          const mData = ensureMonth(state.ui.activeMonth);
          mData.transactions = (mData.transactions || []).filter(x => x.id !== id);
          persist();
          closeModal();
          renderApp();
          showToast('Операция удалена');
        }
        else if (action === 'open-settings') {
          showSettingsModal();
        }
        else if (action === 'close-modal') {
          closeModal();
        }
        else if (action === 'download-backup') {
          try {
            const jsonStr = getBackupJson();
            const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lifeos_backup_${getTodayISO()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('Файл резервной копии скачан');
          } catch (err) {
            showToast('Скопируйте JSON-код из поля ниже');
          }
        }
        else if (action === 'copy-backup') {
          const ta = document.getElementById('backup-export-ta');
          if (!ta) return;
          ta.value = getBackupJson();
          ta.select();
          ta.setSelectionRange(0, 999999);
          try {
            document.execCommand('copy');
            showToast('JSON-код скопирован в буфер');
          } catch (err) {
            showToast('Выделите и скопируйте текст вручную');
          }
        }
        else if (action === 'import-backup-text') {
          const ta = document.getElementById('backup-import-ta');
          if (!ta || !ta.value.trim()) {
            showToast('Вставьте JSON-текст в поле');
            return;
          }
          try {
            const parsed = JSON.parse(ta.value.trim());
            const cand = (parsed && parsed.data && parsed.tasks) ? parsed.data : parsed;
            state = sanitizeState(cand);
            persist();
            closeModal();
            renderApp();
            showToast('Данные восстановлены из копии!');
          } catch (err) {
            showToast('Ошибка: некорректный JSON');
          }
        }
        else if (action === 'show-reset-confirm') {
          const box = document.getElementById('reset-confirm-box');
          if (box) box.style.display = 'block';
        }
        else if (action === 'hide-reset-confirm') {
          const box = document.getElementById('reset-confirm-box');
          if (box) box.style.display = 'none';
        }
        else if (action === 'confirm-clean-slate') {
          const now = new Date();
          const curYm = getYmKey(now.getFullYear(), now.getMonth());
          const cleanCats = buildDefaultCategories();
          BUDGET_GROUPS.forEach(g => cleanCats[g.key].forEach(s => { s.plan = 0; }));

          state.tasks = [];
          state.habits = [];
          state.months = {
            [curYm]: {
              startBalance: 0,
              dailyLimit: 0,
              categories: cleanCats,
              transactions: []
            }
          };
          state.ui.activeMonth = curYm;
          state.ui.habitYear = now.getFullYear();
          state.ui.habitMonth = now.getMonth();
          state.ui.weekOffset = 0;
          persist();
          closeModal();
          renderApp();
          showToast('Чистый лист готов!');
        }
        else if (action === 'load-demo-data') {
          const curTab = state.ui.tab;
          state = createDemoState();
          state.ui.tab = curTab;
          persist();
          closeModal();
          renderApp();
          showToast('Демо-примеры загружены');
        }
      });

      document.addEventListener('change', function(e) {
        const el = e.target;
        if (!el) return;

        if (el.classList.contains('budget-meta-input')) {
          const field = el.getAttribute('data-field');
          const mData = ensureMonth(state.ui.activeMonth);
          mData[field] = Math.max(0, Number(el.value) || 0);
          persist();
          renderApp();
          showToast('Обновлено');
        }
        else if (el.classList.contains('subcat-plan-input')) {
          const gKey = el.getAttribute('data-group');
          const subId = el.getAttribute('data-subid');
          const mData = ensureMonth(state.ui.activeMonth);
          const sc = (mData.categories[gKey] || []).find(x => x.id === subId);
          if (sc) {
            sc.plan = Math.max(0, Number(el.value) || 0);
            persist();
            renderApp();
          }
        }
        else if (el.id === 'f-task-type') {
          const wrap = document.getElementById('f-rec-wrap');
          if (wrap) wrap.style.display = el.value === 'Повторяющаяся' ? 'block' : 'none';
        }
        else if (el.id === 'f-tx-group') {
          populateSubcatSelect(el.value, null);
        }
        else if (el.id === 'backup-file-input') {
          const file = el.files && el.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(ev) {
            try {
              const parsed = JSON.parse(ev.target.result);
              const cand = (parsed && parsed.data && parsed.tasks) ? parsed.data : parsed;
              state = sanitizeState(cand);
              persist();
              closeModal();
              renderApp();
              showToast('Резервная копия успешно загружена!');
            } catch (err) {
              showToast('Ошибка: файл повреждён или не от LifeOS');
            }
          };
          reader.readAsText(file);
        }
      });

      document.addEventListener('input', function(e) {
        const el = e.target;
        if (!el) return;

        if (el.id === 'f-task-prog') {
          const lbl = document.getElementById('f-prog-lbl');
          if (lbl) lbl.textContent = el.value + '%';
        }
        else if (el.id === 'budget-search-input') {
          state.ui.budgetSearch = el.value;
          persist();
          renderApp();
          const reFocused = document.getElementById('budget-search-input');
          if (reFocused) {
            reFocused.focus();
            reFocused.setSelectionRange(reFocused.value.length, reFocused.value.length);
          }
        }
      });

      document.addEventListener('submit', function(e) {
        const form = e.target;
        if (!form) return;

        if (form.id === 'form-task') {
          e.preventDefault();
          const editId = form.getAttribute('data-edit-id');
          const title = document.getElementById('f-task-title').value.trim();
          if (!title) return;

          const startDate = document.getElementById('f-task-start').value;
          let endDate = document.getElementById('f-task-end').value;
          if (endDate < startDate) endDate = startDate;

          const status = document.getElementById('f-task-status').value;
          let progress = Number(document.getElementById('f-task-prog').value);
          const completed = status === 'Сделано' || progress === 100;
          if (completed) progress = 100;

          const prevTask = editId ? state.tasks.find(x => x.id === editId) : null;
          const wasCompleted = prevTask ? prevTask.completed : false;

          const taskObj = {
            id: editId || ('t-' + Date.now()),
            title,
            desc: document.getElementById('f-task-desc').value.trim(),
            assignee: document.getElementById('f-task-assignee').value.trim() || 'Я',
            type: document.getElementById('f-task-type').value,
            recurrence: document.getElementById('f-task-rec').value,
            phase: document.getElementById('f-task-phase').value.trim() || 'Общий проект',
            priority: document.getElementById('f-task-priority').value,
            status: completed ? 'Сделано' : status,
            important: document.getElementById('f-task-imp').checked,
            urgent: document.getElementById('f-task-urg').checked,
            startDate,
            endDate,
            progress,
            completed,
            _spawned: prevTask ? prevTask._spawned : false
          };

          if (editId) {
            const idx = state.tasks.findIndex(x => x.id === editId);
            if (idx !== -1) state.tasks[idx] = taskObj;
          } else {
            state.tasks.unshift(taskObj);
          }

          let nextDate = null;
          if (completed && !wasCompleted) {
            nextDate = spawnNextRecurring(taskObj);
          }

          persist();
          closeModal();
          renderApp();
          showToast(nextDate ? `Выполнено! Повтор на ${formatShortDate(nextDate)}` : (editId ? 'Задача обновлена' : 'Задача создана'));
        }
        else if (form.id === 'form-habit') {
          e.preventDefault();
          const editId = form.getAttribute('data-edit-id');
          const name = document.getElementById('f-hab-name').value.trim();
          if (!name) return;
          const target = Math.min(31, Math.max(1, Number(document.getElementById('f-hab-target').value) || 20));
          const color = document.getElementById('f-hab-color').value || '#10b981';

          if (editId) {
            const h = state.habits.find(x => x.id === editId);
            if (h) { h.name = name; h.target = target; h.color = color; }
          } else {
            state.habits.push({ id: 'h-' + Date.now(), name, target, color, logs: {} });
          }

          persist();
          closeModal();
          renderApp();
          showToast(editId ? 'Привычка обновлена' : 'Привычка добавлена');
        }
        else if (form.id === 'form-subcat') {
          e.preventDefault();
          const gKey = form.getAttribute('data-group');
          const name = document.getElementById('f-sc-name').value.trim();
          if (!name) return;
          const plan = Math.max(0, Number(document.getElementById('f-sc-plan').value) || 0);
          const dueEl = document.getElementById('f-sc-due');
          const dueDay = (dueEl && dueEl.value) ? String(dueEl.value).padStart(2, '0') : '';

          const mData = ensureMonth(state.ui.activeMonth);
          mData.categories[gKey].push({ id: 'sc-' + Date.now(), name, plan, dueDay });
          state.ui.expandedGroups[gKey] = true;

          persist();
          closeModal();
          renderApp();
          showToast('Подкатегория добавлена');
        }
        else if (form.id === 'form-tx') {
          e.preventDefault();
          const editId = form.getAttribute('data-edit-id');
          const amount = Number(document.getElementById('f-tx-amount').value);
          if (!amount || amount <= 0) return;

          const txDate = document.getElementById('f-tx-date').value;
          const txYm = txDate.slice(0, 7);
          const targetMonthData = ensureMonth(txYm);

          const txObj = {
            id: editId || ('tx-' + Date.now()),
            date: txDate,
            group: document.getElementById('f-tx-group').value,
            sub: document.getElementById('f-tx-sub').value || 'Прочее',
            amount,
            desc: document.getElementById('f-tx-desc').value.trim()
          };

          if (editId) {
            Object.values(state.months).forEach(m => {
              m.transactions = (m.transactions || []).filter(x => x.id !== editId);
            });
          }
          targetMonthData.transactions.push(txObj);
          state.ui.activeMonth = txYm;

          persist();
          closeModal();
          renderApp();
          showToast(editId ? 'Операция обновлена' : 'Операция записана');
        }
      });

      // =========================================================================
      // 10. ГЛАВНЫЙ РЕНДЕР
      // =========================================================================
      function renderApp() {
        const now = new Date();
        const weekDaysFull = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
        const dateEl = document.getElementById('header-date');
        if (dateEl) {
          dateEl.textContent = `Личный центр управления • ${weekDaysFull[now.getDay()]}, ${now.getDate()} ${MONTHS_GEN[now.getMonth()]}`;
        }

        const curTab = state.ui.tab || 'dashboard';
        ['dashboard', 'tasks', 'habits', 'budget'].forEach(t => {
          const btn = document.getElementById('nav-' + t);
          if (btn) btn.classList.toggle('active', t === curTab);
        });

        const main = document.getElementById('app-main');
        if (!main) return;
        if (curTab === 'dashboard') main.innerHTML = renderDashboard();
        else if (curTab === 'tasks') main.innerHTML = renderTasks();
        else if (curTab === 'habits') main.innerHTML = renderHabits();
        else if (curTab === 'budget') main.innerHTML = renderBudget();
      }

      renderApp();
    })();
  </script>
</body>
</html>
